<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>딱지치기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    user-select: none;
  }
  h1 { font-size: 2rem; margin-bottom: 8px; color: #f5c842; }
  #score-board { font-size: 1rem; margin-bottom: 16px; color: #aaa; }
  #game-area {
    position: relative;
    width: 500px; height: 500px;
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 12px;
    overflow: hidden;
  }
  canvas { display: block; }
  #rps-overlay {
    position: absolute;
    bottom: 20px; left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  .rps-btn {
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 2.2rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
  }
  .rps-btn span.label { font-size: 0.7rem; color: #ccc; }
  .rps-btn:hover {
    background: rgba(245,200,66,0.25);
    border-color: #f5c842;
    transform: translateY(-4px);
  }
  #message {
    margin-top: 16px; font-size: 1.3rem;
    min-height: 2rem; color: #f5c842; text-align: center;
  }
  #instruction {
    margin-top: 8px; font-size: 0.95rem;
    color: #888; text-align: center;
  }
  #restart-btn {
    margin-top: 16px; padding: 10px 28px;
    font-size: 1rem; background: #f5c842;
    color: #1a1a2e; border: none; border-radius: 8px;
    cursor: pointer; display: none; font-weight: bold;
  }
  #restart-btn:hover { background: #e0b030; }
</style>
</head>
<body>
<h1>🃏 딱지치기</h1>
<div id="score-board">내 딱지: <span id="my-score">3</span> &nbsp;|&nbsp; 상대 딱지: <span id="opp-score">3</span></div>
<div id="game-area">
  <canvas id="canvas" width="500" height="500"></canvas>
  <div id="rps-overlay" style="display:none;">
    <button class="rps-btn" onclick="chooseRPS('scissors')">✌️<span class="label">가위</span></button>
    <button class="rps-btn" onclick="chooseRPS('rock')">✊<span class="label">바위</span></button>
    <button class="rps-btn" onclick="chooseRPS('paper')">🖐️<span class="label">보</span></button>
  </div>
</div>
<div id="message"></div>
<div id="instruction"></div>
<button id="restart-btn" onclick="restartGame()">다시 시작</button>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 500, H = 500;

// ─── 상태 ───────────────────────────────────────────────
// 'rps-select' | 'rps-anim' | 'rps-result'
// 'my-x' | 'my-y' | 'my-slide' | 'my-flip' | 'my-result'
// 'opp-x' | 'opp-y' | 'opp-slide' | 'opp-flip' | 'opp-result'
// 'over'
let phase = 'rps-select';
let animId;

let myScore = 3, oppScore = 3;

// 딱지 설정
const CX = W / 2, CY = H / 2;
const DW = 80, DH = 80;

// 내 턴: 내 딱지가 날아가서 상대 딱지(중앙)를 침
let myAimX = CX, myAimY = CY;      // 내가 정한 목표 좌표
let mySlide = { x: CX, y: H + 60 }; // 내 딱지 슬라이드
let myFlipProg = 0;                   // 내 딱지 뒤집기(상대 턴 성공 시)
let oppFlipProg = 0;                  // 상대 딱지 뒤집기(내 턴 성공 시)
let oppFlipped = false;

// 상대 턴: 상대 딱지가 날아가서 내 딱지(중앙)를 침
let oppAimX = CX, oppAimY = CY;
let oppSlide = { x: CX, y: -60 };

// 공통 바 위치 (x축, y축 커서)
let barX = CX, barXDir = 1;
let barY = CY, barYDir = 1;
const BAR_SPEED = 4;

// 결과 표시
let resultText = '', resultColor = '#fff';

// RPS
let rpsMyChoice = null, rpsOppChoice = null;
let rpsHandY = { my: H + 120, opp: H + 120 };
const RPS_LABELS = { rock: '바위', scissors: '가위', paper: '보' };

// ─── 유틸 ────────────────────────────────────────────────
function setMsg(t)  { document.getElementById('message').textContent = t; }
function setHint(t) { document.getElementById('instruction').textContent = t; }
function showRpsOverlay(v) { document.getElementById('rps-overlay').style.display = v ? 'flex' : 'none'; }
function shadeColor(hex, p) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${clamp((n>>16)+p)},${clamp(((n>>8)&0xff)+p)},${clamp((n&0xff)+p)})`;
}
function clamp(v) { return Math.max(0, Math.min(255, v)); }
function calcProb(x, y, tx, ty) {
  const overlapW = Math.max(0, Math.min(x+DW/2, tx+DW/2) - Math.max(x-DW/2, tx-DW/2));
  const overlapH = Math.max(0, Math.min(y+DH/2, ty+DH/2) - Math.max(y-DH/2, ty-DH/2));
  return (overlapW * overlapH) / (DW * DH);
}

// ─── 딱지 그리기 ─────────────────────────────────────────
function drawDdakji(cx, cy, scaleX, front, back, label) {
  const abs = Math.abs(scaleX), isFront = scaleX >= 0;
  const col = isFront ? front : back;
  const inner = shadeColor(col, -22);
  const w = DW * abs, h = DH;
  if (w < 1) return;
  const tx = cx - w/2, ty = cy - h/2;

  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(tx+4, ty+4, w, h);
  ctx.fillStyle = col;
  ctx.fillRect(tx, ty, w, h);
  if (w > 20) {
    const p = Math.min(8, w*.1);
    ctx.fillStyle = inner;
    ctx.fillRect(tx+p, ty+p, w-p*2, h-p*2);
    if (w > 40) {
      ctx.fillStyle = col;
      ctx.fillRect(tx+p*2, ty+p*2, w-p*4, h-p*4);
    }
  }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.strokeRect(tx, ty, w, h);
  if (label && w > 30) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, cx, ty - 8);
  }
}

// 상대 딱지 (내 턴: 중앙에 놓인 것 / 내 뒤집기 중)
function drawOppDdakjiStatic() {
  let sx;
  if (oppFlipProg <= .5) sx = 1 - oppFlipProg * 2;
  else sx = -(oppFlipProg - .5) * 2;
  const jy = phase === 'my-flip' ? -Math.sin(oppFlipProg * Math.PI) * 30 : 0;
  drawDdakji(CX, CY + jy, sx, '#e74c3c', '#8e44ad', oppFlipped ? null : '상대 딱지');
}

// 내 딱지 (상대 턴: 중앙에 놓인 것 / 상대 뒤집기 중)
function drawMyDdakjiStatic() {
  let sx;
  if (myFlipProg <= .5) sx = 1 - myFlipProg * 2;
  else sx = -(myFlipProg - .5) * 2;
  const jy = phase === 'opp-flip' ? -Math.sin(myFlipProg * Math.PI) * 30 : 0;
  drawDdakji(CX, CY + jy, sx, '#3498db', '#2ecc71', '내 딱지');
}

// ─── 격자 / 바 / 게이지 ──────────────────────────────────
function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
  for (let j = 0; j < H; j += 40) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(W,j); ctx.stroke(); }
}

function drawXBar(col) {
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(0, H-40, W, 30);
  const g = ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'rgba(231,76,60,.3)'); g.addColorStop(.5,'rgba(46,204,113,.6)'); g.addColorStop(1,'rgba(231,76,60,.3)');
  ctx.fillStyle = g; ctx.fillRect(0, H-40, W, 30);
  ctx.fillStyle = col || '#f5c842';
  ctx.beginPath(); ctx.arc(barX, H-25, 10, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle='rgba(245,200,66,.3)'; ctx.lineWidth=1;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(barX,0); ctx.lineTo(barX,H-40); ctx.stroke();
  ctx.setLineDash([]);
}

function drawYBar(col) {
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(0, 0, 30, H);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(231,76,60,.3)'); g.addColorStop(.5,'rgba(46,204,113,.6)'); g.addColorStop(1,'rgba(231,76,60,.3)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 30, H);
  ctx.fillStyle = col || '#f5c842';
  ctx.beginPath(); ctx.arc(15, barY, 10, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle='rgba(245,200,66,.3)'; ctx.lineWidth=1;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(30,barY); ctx.lineTo(W,barY); ctx.stroke();
  ctx.setLineDash([]);
}

function drawProbMeter(prob) {
  const bx=W-110, by=10, bw=100, bh=14;
  ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle = prob>.6?'#2ecc71':prob>.35?'#f39c12':'#e74c3c';
  ctx.fillRect(bx,by,bw*prob,bh);
  ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#fff'; ctx.font='10px sans-serif'; ctx.textAlign='right';
  ctx.fillText(`성공률 ${Math.round(prob*100)}%`, W-10, by+11);
}

function drawTurnLabel(text, col) {
  ctx.fillStyle = col || 'rgba(255,255,255,0.18)';
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(text, 10, 22);
}

// ─── 메인 드로우 ─────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawGrid();

  // ── 내 턴 ──
  if (phase === 'my-x') {
    barX += BAR_SPEED * barXDir;
    if (barX >= W) { barX = W; barXDir = -1; }
    if (barX <= 0) { barX = 0; barXDir = 1; }
    drawOppDdakjiStatic();
    drawXBar('#f5c842');
    drawProbMeter(calcProb(barX, CY, CX, CY));
    drawTurnLabel('▶ 내 차례', '#f5c842');

  } else if (phase === 'my-y') {
    barY += BAR_SPEED * barYDir;
    if (barY >= H-40) { barY = H-40; barYDir = -1; }
    if (barY <= 0) { barY = 0; barYDir = 1; }
    drawOppDdakjiStatic();
    // 고정 X 안내선
    ctx.strokeStyle='rgba(245,200,66,.25)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(myAimX,0); ctx.lineTo(myAimX,H); ctx.stroke();
    ctx.setLineDash([]);
    drawYBar('#f5c842');
    drawProbMeter(calcProb(myAimX, barY, CX, CY));
    drawTurnLabel('▶ 내 차례', '#f5c842');

  } else if (phase === 'my-slide') {
    drawOppDdakjiStatic();
    drawDdakji(mySlide.x, mySlide.y, 1, '#3498db', '#2980b9', null);
    drawProbMeter(calcProb(myAimX, myAimY, CX, CY));
    drawTurnLabel('▶ 내 차례', '#f5c842');

  } else if (phase === 'my-flip') {
    drawOppDdakjiStatic();
    drawDdakji(myAimX, myAimY, 1, '#3498db', '#2980b9', null);
    drawProbMeter(calcProb(myAimX, myAimY, CX, CY));
    drawTurnLabel('▶ 내 차례', '#f5c842');

  } else if (phase === 'my-result') {
    drawOppDdakjiStatic();
    drawDdakji(myAimX, myAimY, 1, '#3498db', '#2980b9', null);
    ctx.fillStyle = resultColor;
    ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.shadowColor = resultColor; ctx.shadowBlur = 16;
    ctx.fillText(resultText, W/2, 60);
    ctx.shadowBlur = 0;
    drawProbMeter(calcProb(myAimX, myAimY, CX, CY));
    drawTurnLabel('▶ 내 차례', '#f5c842');

  // ── 상대 턴 ──
  } else if (phase === 'opp-x') {
    barX += BAR_SPEED * 1.3 * barXDir;
    if (barX >= W) { barX = W; barXDir = -1; }
    if (barX <= 0) { barX = 0; barXDir = 1; }
    drawMyDdakjiStatic();
    drawXBar('#e74c3c');
    drawProbMeter(calcProb(barX, CY, CX, CY));
    drawTurnLabel('◀ 상대 차례', '#e74c3c');

  } else if (phase === 'opp-y') {
    barY += BAR_SPEED * 1.3 * barYDir;
    if (barY >= H-40) { barY = H-40; barYDir = -1; }
    if (barY <= 0) { barY = 0; barYDir = 1; }
    drawMyDdakjiStatic();
    ctx.strokeStyle='rgba(231,76,60,.25)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(oppAimX,0); ctx.lineTo(oppAimX,H); ctx.stroke();
    ctx.setLineDash([]);
    drawYBar('#e74c3c');
    drawProbMeter(calcProb(oppAimX, barY, CX, CY));
    drawTurnLabel('◀ 상대 차례', '#e74c3c');

  } else if (phase === 'opp-slide') {
    drawMyDdakjiStatic();
    drawDdakji(oppSlide.x, oppSlide.y, 1, '#e74c3c', '#c0392b', null);
    drawProbMeter(calcProb(oppAimX, oppAimY, CX, CY));
    drawTurnLabel('◀ 상대 차례', '#e74c3c');

  } else if (phase === 'opp-flip') {
    drawMyDdakjiStatic();
    drawDdakji(oppAimX, oppAimY, 1, '#e74c3c', '#c0392b', null);
    drawProbMeter(calcProb(oppAimX, oppAimY, CX, CY));
    drawTurnLabel('◀ 상대 차례', '#e74c3c');

  } else if (phase === 'opp-result') {
    drawMyDdakjiStatic();
    drawDdakji(oppAimX, oppAimY, 1, '#e74c3c', '#c0392b', null);
    ctx.fillStyle = resultColor;
    ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.shadowColor = resultColor; ctx.shadowBlur = 16;
    ctx.fillText(resultText, W/2, 60);
    ctx.shadowBlur = 0;
    drawProbMeter(calcProb(oppAimX, oppAimY, CX, CY));
    drawTurnLabel('◀ 상대 차례', '#e74c3c');
  }
}

function gameLoop() {
  draw();
  const running = ['my-x','my-y','opp-x','opp-y'];
  if (running.includes(phase)) animId = requestAnimationFrame(gameLoop);
}

// ─── 애니메이션 헬퍼 ─────────────────────────────────────
function animSlide(slide, startX, startY, endX, endY, drawFn, onDone) {
  slide.x = startX; slide.y = startY;
  const FRAMES = 30; let f = 0;
  function step() {
    f++;
    const t = f/FRAMES;
    const ease = t<.5 ? 2*t*t : -1+(4-2*t)*t;
    slide.x = startX + (endX-startX)*ease;
    slide.y = startY + (endY-startY)*ease;
    drawFn();
    if (f < FRAMES) animId = requestAnimationFrame(step);
    else onDone();
  }
  animId = requestAnimationFrame(step);
}

function animFlip(progressRef, setter, FRAMES, onDone) {
  setter(0);
  let f = 0;
  function step() {
    f++;
    setter(f/FRAMES);
    draw();
    if (f < FRAMES) animId = requestAnimationFrame(step);
    else onDone();
  }
  animId = requestAnimationFrame(step);
}

// 바가 자동으로 목표값으로 이동하는 애니메이션
function animBarSnap(getter, setter, target, onDone) {
  const start = getter();
  const FRAMES = 25; let f = 0;
  function step() {
    f++;
    const t = f/FRAMES;
    const ease = 1-Math.pow(1-t,3);
    setter(start + (target-start)*ease);
    draw();
    if (f < FRAMES) animId = requestAnimationFrame(step);
    else { setter(target); onDone(); }
  }
  animId = requestAnimationFrame(step);
}

// ─── 내 턴 플로우 ───────────────────────────────────────
canvas.addEventListener('click', () => {
  if (phase === 'my-x') {
    cancelAnimationFrame(animId);
    myAimX = barX;
    phase = 'my-y';
    barY = CY; barYDir = 1;
    setMsg('클릭해서 Y축 위치를 정하세요!');
    gameLoop();
  } else if (phase === 'my-y') {
    cancelAnimationFrame(animId);
    myAimY = barY;
    startMySlide();
  }
});

function startMySlide() {
  phase = 'my-slide';
  const prob = calcProb(myAimX, myAimY, CX, CY);
  const success = Math.random() < prob;
  setMsg('딱지를 던졌다!');
  animSlide(mySlide, CX, H+60, myAimX, myAimY, draw, () => {
    if (success) {
      phase = 'my-flip';
      setMsg('딱지 넘어간다! 🎉');
      animFlip(oppFlipProg, v => { oppFlipProg = v; }, 40, () => {
        oppFlipped = true;
        oppScore--;
        document.getElementById('opp-score').textContent = oppScore;
        resultText = '딱지 넘어감! 🎉'; resultColor = '#2ecc71';
        setMsg(`성공률 ${Math.round(prob*100)}% → 성공! 상대 딱지를 가져왔어요!`);
        phase = 'my-result'; draw();
        afterTurn();
      });
    } else {
      myScore--;
      document.getElementById('my-score').textContent = myScore;
      resultText = '실패... 😢'; resultColor = '#e74c3c';
      setMsg(`성공률 ${Math.round(prob*100)}% → 실패. 내 딱지를 잃었어요.`);
      phase = 'my-result'; draw();
      afterTurn();
    }
  });
}

// ─── 상대 턴 플로우 ─────────────────────────────────────
function startOppTurn() {
  if (myScore <= 0 || oppScore <= 0) return;

  // 상대 목표 좌표 결정 (랜덤, 중앙 편향)
  oppAimX = CX + (Math.random()-.5)*W*.8;
  oppAimY = CY + (Math.random()-.5)*H*.8;
  const prob = calcProb(oppAimX, oppAimY, CX, CY);
  const success = Math.random() < prob;

  phase = 'opp-x';
  barX = CX; barXDir = 1;
  myFlipProg = 0;
  resultText = ''; resultColor = '#fff';
  setMsg('상대방이 X축을 조준합니다...');
  setHint('');
  gameLoop();

  // X바 자동 이동 후 스냅
  setTimeout(() => {
    cancelAnimationFrame(animId);
    animBarSnap(() => barX, v => barX = v, oppAimX, () => {
      setMsg('상대방이 Y축을 조준합니다...');
      phase = 'opp-y';
      barY = CY; barYDir = 1;
      gameLoop();

      // Y바 자동 이동 후 스냅
      setTimeout(() => {
        cancelAnimationFrame(animId);
        animBarSnap(() => barY, v => barY = v, oppAimY, () => {
          setMsg('상대방이 딱지를 던졌다!');
          phase = 'opp-slide';

          animSlide(oppSlide, CX, -60, oppAimX, oppAimY, draw, () => {
            if (success) {
              phase = 'opp-flip';
              setMsg('내 딱지가 넘어간다! 😱');
              animFlip(myFlipProg, v => { myFlipProg = v; }, 40, () => {
                myScore--;
                document.getElementById('my-score').textContent = myScore;
                resultText = '내 딱지 넘어감... 😢'; resultColor = '#e74c3c';
                setMsg(`성공률 ${Math.round(prob*100)}% → 상대 성공! 내 딱지를 잃었어요.`);
                phase = 'opp-result'; draw();
                afterTurn();
              });
            } else {
              resultText = '상대 실패! 😄'; resultColor = '#2ecc71';
              setMsg(`성공률 ${Math.round(prob*100)}% → 상대 실패! 딱지를 지켰어요!`);
              phase = 'opp-result'; draw();
              afterTurn();
            }
          });
        });
      }, 900);
    });
  }, 900);
}

// ─── 공통 턴 후처리 ─────────────────────────────────────
function afterTurn() {
  if (oppScore <= 0 || myScore <= 0) {
    setTimeout(() => {
      phase = 'over';
      const win = oppScore <= 0;
      setMsg(win ? '🏆 게임 승리! 상대방 딱지를 모두 가져왔어요!' : '💀 게임 패배...');
      setHint('');
      document.getElementById('restart-btn').style.display = 'inline-block';
    }, 1200);
  } else if (phase === 'my-result') {
    setTimeout(startOppTurn, 2000);
  } else {
    setTimeout(startMyTurn, 2000);
  }
}

function startMyTurn() {
  phase = 'my-x';
  barX = CX; barXDir = 1;
  oppFlipProg = 0; oppFlipped = false;
  myFlipProg = 0;
  resultText = '';
  setMsg('클릭해서 X축 위치를 정하세요!');
  setHint('중앙에 가까울수록 딱지가 넘어갈 확률이 높아요');
  gameLoop();
}

// ─── 가위바위보 ─────────────────────────────────────────
function drawHand(cx, cy, choice, mirror) {
  ctx.save();
  ctx.translate(cx, cy);
  if (mirror) ctx.scale(-1,1);

  ctx.fillStyle = '#f0c080';
  ctx.beginPath(); ctx.roundRect(-28,20,56,70,8); ctx.fill();
  ctx.strokeStyle = '#c89050'; ctx.lineWidth = 2; ctx.stroke();

  if (choice === 'rock') {
    ctx.fillStyle = '#f0c080';
    ctx.beginPath(); ctx.roundRect(-30,-20,60,50,14); ctx.fill();
    ctx.strokeStyle = '#c89050'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#c89050'; ctx.lineWidth = 1.5;
    [-15,-5,5,15].forEach(i => {
      ctx.beginPath(); ctx.moveTo(i,-5); ctx.lineTo(i,15); ctx.stroke();
    });
    ctx.fillStyle='#f0c080'; ctx.beginPath(); ctx.ellipse(-32,10,12,8,-0.4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#c89050'; ctx.lineWidth=2; ctx.stroke();

  } else if (choice === 'scissors') {
    [{x:-14,len:58,a:-0.15},{x:2,len:60,a:0.05}].forEach(f => {
      ctx.save(); ctx.translate(f.x,-10); ctx.rotate(f.a);
      ctx.fillStyle='#f0c080'; ctx.beginPath(); ctx.roundRect(-9,-f.len,18,f.len,8); ctx.fill();
      ctx.strokeStyle='#c89050'; ctx.lineWidth=2; ctx.stroke();
      ctx.restore();
    });
    ctx.fillStyle='#f0c080'; ctx.beginPath(); ctx.roundRect(-4,-8,34,32,10); ctx.fill();
    ctx.strokeStyle='#c89050'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#f0c080'; ctx.beginPath(); ctx.ellipse(-30,10,12,8,-0.3,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#c89050'; ctx.lineWidth=2; ctx.stroke();

  } else {
    [{x:-28,len:50,a:-.35},{x:-14,len:62,a:-.12},{x:0,len:65,a:.02},{x:14,len:60,a:.18},{x:26,len:48,a:.4}].forEach(f => {
      ctx.save(); ctx.translate(f.x,-10); ctx.rotate(f.a);
      ctx.fillStyle='#f0c080'; ctx.beginPath(); ctx.roundRect(-8,-f.len,16,f.len,7); ctx.fill();
      ctx.strokeStyle='#c89050'; ctx.lineWidth=2; ctx.stroke();
      ctx.restore();
    });
    ctx.fillStyle='#f0c080'; ctx.beginPath(); ctx.roundRect(-30,-12,60,38,10); ctx.fill();
    ctx.strokeStyle='#c89050'; ctx.lineWidth=2; ctx.stroke();
  }
  ctx.restore();
}

function drawRpsScene() {
  ctx.clearRect(0,0,W,H); drawGrid();
  ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
  ctx.fillText('나', W/4, 24); ctx.fillText('상대', W*3/4, 24);

  if (phase === 'rps-select') {
    ctx.fillStyle='rgba(255,255,255,.12)'; ctx.font='72px sans-serif'; ctx.textAlign='center';
    ctx.fillText('✊', W/4, H/2+24); ctx.fillText('✊', W*3/4, H/2+24);
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='bold 20px sans-serif';
    ctx.fillText('?', W/4, H/2+24); ctx.fillText('?', W*3/4, H/2+24);
  } else {
    if (rpsMyChoice)  drawHand(W/4,    rpsHandY.my,  rpsMyChoice,  false);
    if (rpsOppChoice) drawHand(W*3/4,  rpsHandY.opp, rpsOppChoice, true);
  }

  if (phase === 'rps-result') {
    const out = rpsWinner();
    const text  = out==='win'?'선공 획득!':out==='lose'?'상대 선공...':'비겼다!';
    const color = out==='win'?'#2ecc71':out==='lose'?'#e74c3c':'#f5c842';
    ctx.fillStyle=color; ctx.font='bold 38px sans-serif'; ctx.textAlign='center';
    ctx.shadowColor=color; ctx.shadowBlur=20;
    ctx.fillText(text, W/2, H/2);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='14px sans-serif';
    ctx.fillText(RPS_LABELS[rpsMyChoice]+' vs '+RPS_LABELS[rpsOppChoice], W/2, H/2+34);
  }
}

function rpsWinner() {
  if (rpsMyChoice === rpsOppChoice) return 'draw';
  if ((rpsMyChoice==='rock'&&rpsOppChoice==='scissors')||
      (rpsMyChoice==='scissors'&&rpsOppChoice==='paper')||
      (rpsMyChoice==='paper'&&rpsOppChoice==='rock')) return 'win';
  return 'lose';
}

function chooseRPS(choice) {
  if (phase !== 'rps-select') return;
  rpsMyChoice = choice;
  rpsOppChoice = ['rock','scissors','paper'][Math.floor(Math.random()*3)];
  showRpsOverlay(false);
  setMsg(`${RPS_LABELS[choice]}!`); setHint('');
  phase = 'rps-anim';
  rpsHandY.my = rpsHandY.opp = H+120;
  const TARGET_H = H/2+30;
  const FRAMES = 35; let f = 0;
  function step() {
    f++;
    const ease = 1-Math.pow(1-f/FRAMES,3);
    rpsHandY.my = rpsHandY.opp = H+120+(TARGET_H-H-120)*ease;
    drawRpsScene();
    if (f < FRAMES) animId = requestAnimationFrame(step);
    else {
      rpsHandY.my = rpsHandY.opp = TARGET_H;
      phase = 'rps-result'; drawRpsScene();
      handleRpsResult();
    }
  }
  animId = requestAnimationFrame(step);
}

function handleRpsResult() {
  const out = rpsWinner();
  if (out === 'draw') {
    setMsg('비겼다! 다시 가위바위보!');
    setTimeout(() => {
      phase='rps-select';
      showRpsOverlay(true);
      setHint('가위, 바위, 보 중 하나를 선택하세요');
      drawRpsScene();
    }, 1400);
  } else if (out === 'win') {
    setMsg('이겼다! 내가 먼저 시작!');
    setTimeout(startMyTurn, 1600);
  } else {
    setMsg('졌다... 상대가 먼저 시작!');
    setTimeout(startOppTurn, 1600);
  }
}

// ─── 리스타트 ────────────────────────────────────────────
function restartGame() {
  myScore = 3; oppScore = 3;
  document.getElementById('my-score').textContent = myScore;
  document.getElementById('opp-score').textContent = oppScore;
  document.getElementById('restart-btn').style.display = 'none';
  cancelAnimationFrame(animId);
  oppFlipProg = 0; oppFlipped = false; myFlipProg = 0; resultText = '';
  startRps();
}

function startRps() {
  phase = 'rps-select';
  rpsMyChoice = null; rpsOppChoice = null;
  showRpsOverlay(true);
  setMsg('가위바위보로 선공을 정합니다!');
  setHint('가위, 바위, 보 중 하나를 선택하세요');
  drawRpsScene();
}

startRps();
</script>
