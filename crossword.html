<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>십자말풀이</title>
<style>
  :root{
    --cs: min(64px, calc((100vw - 32px) / 12));
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: #000;
    color: #eee;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 16px;
  }
  h1{
    text-align: center;
    font-size: 22px;
    margin: 8px 0 4px;
    letter-spacing: 4px;
  }
  .toolbar{
    text-align: center;
    margin: 8px 0 16px;
    font-size: 14px;
  }
  .toolbar button{
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 14px;
    margin: 0 4px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .toolbar button:hover{ background: #333; }
  #dirLabel{
    display: inline-block;
    min-width: 120px;
    color: #ffd257;
  }
  #syncStatus{
    display: block;
    margin-top: 6px;
    font-size: 13px;
    color: #888;
  }
  #syncStatus.on{ color: #6fdc8c; }
  #grid{
    display: grid;
    grid-template-columns: repeat(12, var(--cs));
    grid-auto-rows: var(--cs);
    width: max-content;
    margin: 0 auto;
  }
  .cell{ position: relative; }
  .cell.white{
    background: #fff;
    border: 1px solid #000;
  }
  /* 굵은 구분선 (원본 이미지의 두꺼운 가로줄) */
  .cell.bar-top{ border-top: 5px solid #000; }
  .cell.white input{
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    text-align: center;
    font-size: calc(var(--cs) * 0.48);
    font-weight: 700;
    color: #111;
    outline: none;
    padding: 0;
    font-family: inherit;
    caret-color: #c0392b;
  }
  .cell.white.hl{ background: #fff3c4; }
  .cell.white.hl input{ background: transparent; }
  .cell.white:focus-within{ background: #ffd257; }
  .num{
    position: absolute;
    top: 1px;
    left: 4px;
    font-size: calc(var(--cs) * 0.26);
    line-height: 1.1;
    color: #7a1f1f;
    font-weight: 600;
    pointer-events: none;
    z-index: 2;
  }
  .clues{
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    max-width: 900px;
    margin: 28px auto 40px;
  }
  .clues > div{ flex: 1 1 340px; }
  .clues h2{
    font-size: 16px;
    margin: 0 0 6px;
    color: #ffd257;
  }
  .clues textarea{
    width: 100%;
    min-height: 220px;
    background: #111;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    line-height: 1.7;
    font-family: inherit;
    resize: vertical;
  }
  @media print{
    body{ background: #fff; color: #000; }
    .toolbar{ display: none; }
    #grid, .cell{ print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .cell.white{ border-color: #000; }
    .clues textarea{ background: #fff; color: #000; border-color: #999; }
  }
</style>
</head>
<body>

<h1>십자말풀이</h1>
<div class="toolbar">
  <span id="dirLabel">입력 방향: 가로 →</span>
  <button id="btnShare">링크 복사</button>
  <span style="color:#888; font-size:12px;">(칸을 한 번 더 클릭하면 가로/세로 전환)</span>
  <span id="syncStatus">오프라인 모드 (이 기기에만 저장)</span>
</div>

<div id="grid"></div>

<div class="clues">
  <div>
    <h2>가로 열쇠</h2>
    <textarea id="acrossClues" placeholder="예) 2. ○○○○&#10;5. ○○○"></textarea>
  </div>
  <div>
    <h2>세로 열쇠</h2>
    <textarea id="downClues" placeholder="예) 1. ○○&#10;3. ○○○"></textarea>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
  // ==========================================================
  // Firebase 설정 — Firebase 콘솔에서 받은 firebaseConfig를
  // 아래에 붙여넣으면 실시간 공유가 켜집니다. null이면 로컬 모드.
  // ==========================================================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDqdQnPWNIm29YjHN8tUDUjAbf-xnFJQos",
    authDomain: "ja-ac379.firebaseapp.com",
    databaseURL: "https://ja-ac379-default-rtdb.firebaseio.com",
    projectId: "ja-ac379",
    storageBucket: "ja-ac379.firebasestorage.app",
    messagingSenderId: "221710618885",
    appId: "1:221710618885:web:2898aa6e179c93ac11e76c"
  };

  const ROWS = 11, COLS = 12;

  // 흰 칸 위치 (행: [열...]) — 원본 이미지 배치
  const WHITES = {
    0:[3],
    1:[2,3,4,5],
    2:[4,5,6,7],
    3:[1,2,4,5,6],
    4:[1,2,3,4,5,8,9,10],
    5:[0,1,2,3,5,6,8,9,11],
    6:[1,2,3,6,7,9],
    7:[5,6,7,9,10],
    8:[4,5,6,7],
    9:[6,7,8,9],
    10:[8]
  };

  // 번호 ("행,열": 번호)
  const NUMS = {
    '0,3':1,  '1,2':2,  '1,4':3,  '1,5':4,
    '2,4':5,  '2,5':6,  '2,6':7,  '2,7':8,
    '3,1':9,  '3,2':10, '3,4':11, '3,5':12,
    '4,1':13, '4,3':14, '4,8':15, '4,9':16, '4,10':17,
    '5,0':18, '5,2':19, '5,5':20, '5,6':21, '5,8':22, '5,11':23,
    '6,1':24, '6,3':25, '6,6':26, '6,7':27, '6,9':28,
    '7,5':29, '7,9':30,
    '8,4':31, '8,6':32,
    '9,6':33, '9,8':34, '9,9':35,
    '10,8':36
  };

  // 굵은 구분선(해당 칸의 윗변) — 원본 이미지의 두꺼운 선
  const BARS_TOP = new Set(['2,5','3,5','5,2','6,3','6,9','9,6']);

  const STORE_KEY = 'crossword-smn-v1';
  const grid = document.getElementById('grid');
  const dirLabel = document.getElementById('dirLabel');
  const syncStatus = document.getElementById('syncStatus');
  const acrossClues = document.getElementById('acrossClues');
  const downClues = document.getElementById('downClues');
  const whiteSet = new Set();
  const inputs = {};   // "r,c" -> input
  const cells = {};    // "r,c" -> div
  let dir = 'across';  // 'across' | 'down'

  for (const r in WHITES) for (const c of WHITES[r]) whiteSet.add(r + ',' + c);

  // ---- 그리드 생성 ----
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const key = r + ',' + c;
      const div = document.createElement('div');
      div.className = 'cell';
      if (whiteSet.has(key)) {
        div.classList.add('white');
        if (BARS_TOP.has(key)) div.classList.add('bar-top');
        if (NUMS[key]) {
          const n = document.createElement('span');
          n.className = 'num';
          n.textContent = NUMS[key];
          div.appendChild(n);
        }
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.autocomplete = 'off';
        inp.dataset.r = r;
        inp.dataset.c = c;
        div.appendChild(inp);
        inputs[key] = inp;
        cells[key] = div;
        attach(inp);
      }
      grid.appendChild(div);
    }
  }

  // ==========================================================
  // 실시간 동기화 (Firebase Realtime Database)
  // ==========================================================
  let fbRoot = null;       // rooms/{room} ref
  let myUid = localStorage.getItem('xword-uid');
  if (!myUid) {
    myUid = 'u' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('xword-uid', myUid);
  }
  const COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c', '#e84393', '#f1c40f'];
  function hashCode(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.codePointAt(0)) | 0; return Math.abs(h); }
  const myColor = COLORS[hashCode(myUid) % COLORS.length];
  const myName = '손님' + (hashCode(myUid) % 90 + 10);

  const room = (new URLSearchParams(location.search).get('room') || 'main')
    .replace(/[.#$\[\]\/]/g, '').slice(0, 40) || 'main';

  const k2f = k => k.replace(',', '_');   // Firebase 키용

  function commitCell(inp) {
    if (fbRoot) {
      const key = inp.dataset.r + ',' + inp.dataset.c;
      fbRoot.child('cells/' + k2f(key)).set(inp.value || null);
    } else {
      saveLocal();
    }
  }
  function commitClues() {
    if (fbRoot) {
      fbRoot.child('clues').set({ across: acrossClues.value, down: downClues.value });
    } else {
      saveLocal();
    }
  }

  function initFirebase() {
    if (!FIREBASE_CONFIG || typeof firebase === 'undefined') return false;
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      const db = firebase.database();
      fbRoot = db.ref('rooms/' + room);

      // 연결 상태 표시
      db.ref('.info/connected').on('value', (snap) => {
        if (snap.val()) {
          syncStatus.textContent = '🟢 실시간 연결됨 · 방: ' + room;
          syncStatus.classList.add('on');
          const me = fbRoot.child('presence/' + myUid);
          me.onDisconnect().remove();
          me.update({ name: myName, color: myColor });
        } else {
          syncStatus.textContent = '연결 끊김… 재접속 중';
          syncStatus.classList.remove('on');
        }
      });

      // 칸 내용 수신
      fbRoot.child('cells').on('value', (snap) => {
        const data = snap.val() || {};
        for (const key in inputs) {
          const inp = inputs[key];
          if (inp === document.activeElement && inp._composing) continue; // 입력 조합 중이면 건드리지 않음
          const v = data[k2f(key)] || '';
          if (inp.value !== v) inp.value = v;
        }
      });

      // 열쇠 메모 수신
      fbRoot.child('clues').on('value', (snap) => {
        const d = snap.val() || {};
        if (document.activeElement !== acrossClues) acrossClues.value = d.across || '';
        if (document.activeElement !== downClues) downClues.value = d.down || '';
      });

      // 접속자 커서 표시
      fbRoot.child('presence').on('value', (snap) => {
        const users = snap.val() || {};
        let count = 0;
        for (const k in cells) cells[k].style.boxShadow = '';
        for (const uid in users) {
          count++;
          if (uid === myUid) continue;
          const u = users[uid];
          if (u.cell && cells[u.cell]) {
            cells[u.cell].style.boxShadow = 'inset 0 0 0 3px ' + (u.color || '#3498db');
            cells[u.cell].title = u.name || '';
          }
        }
        if (syncStatus.classList.contains('on')) {
          syncStatus.textContent = '🟢 실시간 연결됨 · ' + count + '명 접속 · 방: ' + room;
        }
      });
      return true;
    } catch (e) {
      console.error('Firebase 초기화 실패:', e);
      return false;
    }
  }

  function reportMyCell(key) {
    if (fbRoot) fbRoot.child('presence/' + myUid).update({ name: myName, color: myColor, cell: key || null });
  }

  // ---- 이동 ----
  function step(r, c, dr, dc) {          // 인접 흰 칸만 (단어 진행용)
    const key = (r + dr) + ',' + (c + dc);
    return inputs[key] || null;
  }
  function scan(r, c, dr, dc) {          // 검은 칸 건너뛰기 (화살표 이동용)
    let nr = r + dr, nc = c + dc;
    while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
      const t = inputs[nr + ',' + nc];
      if (t) return t;
      nr += dr; nc += dc;
    }
    return null;
  }
  function nextCell(inp) {
    const r = +inp.dataset.r, c = +inp.dataset.c;
    return dir === 'across' ? step(r, c, 0, 1) : step(r, c, 1, 0);
  }
  function prevCell(inp) {
    const r = +inp.dataset.r, c = +inp.dataset.c;
    return dir === 'across' ? step(r, c, 0, -1) : step(r, c, -1, 0);
  }

  // ---- 하이라이트 ----
  function clearHl() {
    for (const k in cells) cells[k].classList.remove('hl');
  }
  function updateHl(inp) {
    clearHl();
    const r = +inp.dataset.r, c = +inp.dataset.c;
    const dr = dir === 'down' ? 1 : 0, dc = dir === 'across' ? 1 : 0;
    let sr = r, sc = c;
    while (whiteSet.has((sr - dr) + ',' + (sc - dc))) { sr -= dr; sc -= dc; }
    while (whiteSet.has(sr + ',' + sc)) {
      cells[sr + ',' + sc].classList.add('hl');
      sr += dr; sc += dc;
    }
  }
  function setDir(d, inp) {
    dir = d;
    dirLabel.textContent = dir === 'across' ? '입력 방향: 가로 →' : '입력 방향: 세로 ↓';
    if (inp) updateHl(inp);
  }

  // ---- 로컬 저장 (Firebase 미사용 시) ----
  function saveLocal() {
    const data = { cells: {}, across: acrossClues.value, down: downClues.value };
    for (const k in inputs) if (inputs[k].value) data.cells[k] = inputs[k].value;
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }
  function loadLocal() {
    try {
      const data = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      if (data.cells) for (const k in data.cells) if (inputs[k]) inputs[k].value = data.cells[k];
      if (data.across) acrossClues.value = data.across;
      if (data.down) downClues.value = data.down;
    } catch (e) {}
  }

  // ---- 입력 처리 (한글 IME 대응) ----
  function handleValue(inp) {
    const chars = [...inp.value];
    if (chars.length <= 1) {
      commitCell(inp);
      if (chars.length === 1) {
        const n = nextCell(inp);
        if (n) { n.focus(); n.select && n.select(); }
      }
      return;
    }
    // 글자가 넘치면 다음 칸으로 흘려보내기
    inp.value = chars[0];
    commitCell(inp);
    let cur = inp;
    for (const ch of chars.slice(1)) {
      const n = nextCell(cur);
      if (!n) break;
      n.value = ch;
      commitCell(n);
      cur = n;
    }
    const after = nextCell(cur);
    (after || cur).focus();
  }

  function attach(inp) {
    inp._composing = false;

    inp.addEventListener('compositionstart', () => { inp._composing = true; });
    inp.addEventListener('compositionend', () => {
      inp._composing = false;
      setTimeout(() => handleValue(inp), 0);
    });
    inp.addEventListener('input', () => {
      if (!inp._composing) handleValue(inp);
    });

    inp.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      const r = +inp.dataset.r, c = +inp.dataset.c;
      let t = null;
      switch (e.key) {
        case 'ArrowRight': t = scan(r, c, 0, 1);  if (t) setDir('across'); break;
        case 'ArrowLeft':  t = scan(r, c, 0, -1); if (t) setDir('across'); break;
        case 'ArrowDown':  t = scan(r, c, 1, 0);  if (t) setDir('down');  break;
        case 'ArrowUp':    t = scan(r, c, -1, 0); if (t) setDir('down');  break;
        case 'Backspace':
          if (inp.value === '') {
            e.preventDefault();
            const p = prevCell(inp);
            if (p) { p.value = ''; p.focus(); commitCell(p); }
          }
          return;
        case 'Delete':
          inp.value = ''; commitCell(inp); return;
        case ' ':
        case 'Enter':
          e.preventDefault();
          t = nextCell(inp);
          break;
        default: return;
      }
      if (t) { e.preventDefault(); t.focus(); }
    });

    inp.addEventListener('mousedown', () => {
      inp._wasFocused = (document.activeElement === inp);
    });
    inp.addEventListener('click', () => {
      if (inp._wasFocused) setDir(dir === 'across' ? 'down' : 'across', inp);
      else updateHl(inp);
    });
    inp.addEventListener('focus', () => {
      updateHl(inp);
      reportMyCell(inp.dataset.r + ',' + inp.dataset.c);
    });
    inp.addEventListener('blur', () => {
      // 조합 잔여물 정리: 한 글자만 유지
      const chars = [...inp.value];
      if (chars.length > 1) { inp.value = chars[0]; commitCell(inp); }
    });
  }

  // ---- 버튼 / 열쇠 메모 ----
  let clueTimer = null;
  function clueInput() {
    clearTimeout(clueTimer);
    clueTimer = setTimeout(commitClues, 400);
  }
  acrossClues.addEventListener('input', clueInput);
  downClues.addEventListener('input', clueInput);

  document.getElementById('btnShare').addEventListener('click', async () => {
    const url = location.href;
    try {
      await navigator.clipboard.writeText(url);
      alert('링크가 복사되었습니다. 카톡방에 붙여넣기 하세요!');
    } catch (e) {
      prompt('아래 링크를 복사하세요:', url);
    }
  });

  // ---- 시작 ----
  if (!initFirebase()) loadLocal();
})();
</script>
</body>
</html>
