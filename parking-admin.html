<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>주차장 관리자</title>
<style>
  :root{
    --navy: #9c1c2e;
    --navy-dark: #7a1522;
    --blue-tint: #fbebec;
    --line: #ecd9da;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #222c36;
    --text-dim: #64707c;
    --ok: #1e8e5a;
    --ok-bg: #e5f4ec;
    --mid: #b8860b;
    --mid-bg: #faf3df;
    --busy: #c9660a;
    --busy-bg: #fbebdb;
    --full: #c0392b;
    --full-bg: #fce6e3;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', -apple-system, sans-serif;
  }

  .gov-header{
    background: var(--navy);
    color: #fff;
    padding: 18px 16px 16px;
    text-align: center;
    border-bottom: 3px solid var(--navy-dark);
  }
  .brand{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .brand-icon{ flex: none; width: 38px; height: 38px; }
  .gov-header h1{
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-align: left;
  }
  .gov-header .sub{
    margin-top: 4px;
    font-size: 12.5px;
    color: #f2cdd2;
    text-align: left;
  }

  #connBar{
    text-align: center;
    font-size: 12.5px;
    color: var(--text-dim);
    background: var(--blue-tint);
    border-bottom: 1px solid var(--line);
    padding: 9px 8px;
  }
  #connBar.on{ color: var(--ok); }
  #connBar.off{ color: var(--full); }

  main{ padding: 18px 16px 50px; }
  .lots{
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .lot-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px 18px;
    box-shadow: 0 1px 2px rgba(156,28,46,0.08);
  }
  .lot-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .lot-name{
    font-size: 15.5px;
    font-weight: 700;
    color: var(--navy);
  }
  .lot-status-badge{
    font-size: 12.5px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 3px;
  }
  .lot-status-badge.여유{ color: var(--ok); background: var(--ok-bg); }
  .lot-status-badge.보통{ color: var(--mid); background: var(--mid-bg); }
  .lot-status-badge.혼잡{ color: var(--busy); background: var(--busy-bg); }
  .lot-status-badge.만차{ color: var(--full); background: var(--full-bg); }
  .lot-status-badge.미설정{ color: var(--text-dim); background: #eef1f4; }

  .lot-updated{
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .btn-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .status-btn{
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 16px 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: filter 0.15s ease, border-color 0.15s ease;
  }
  .status-btn:active{ filter: brightness(0.96); }
  .status-btn.dim{ opacity: 0.55; }
  .status-btn.active{ border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; }

  .btn-ok{ background: var(--ok-bg); color: var(--ok); }
  .btn-mid{ background: var(--mid-bg); color: var(--mid); }
  .btn-busy{ background: var(--busy-bg); color: var(--busy); }
  .btn-full{ background: var(--full-bg); color: var(--full); }

  footer{
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.7;
  }
  footer a{ color: var(--navy); }
</style>
</head>
<body>

<div class="gov-header">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="60" cy="54" r="54" fill="#e3495a"/>
      <path d="M28 96 L46 90 L50 108 L30 112 Z" fill="#7a1522"/>
      <text x="60" y="72" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="58" fill="#ffffff" text-anchor="middle">P</text>
    </svg>
    <div>
      <h1>주차장 관리자</h1>
      <div class="sub">버튼을 누르면 사용자 화면에 바로 반영돼요</div>
    </div>
  </div>
</div>
<div id="connBar">연결 확인 중…</div>

<main>
  <div class="lots" id="lots"></div>

  <footer>
    사용자 화면 미리보기: <a href="parking.html" target="_blank">parking.html →</a><br>
    <span style="opacity:.75;">이 관리자 페이지 링크는 상태를 바꿀 수 있으니 관리자끼리만 공유하세요.</span>
  </footer>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAydvkSqvoAVJ--1R4_aZv7ubZgjJUuKNI",
    authDomain: "parkinglotnhis.firebaseapp.com",
    databaseURL: "https://parkinglotnhis-default-rtdb.firebaseio.com",
    projectId: "parkinglotnhis",
    storageBucket: "parkinglotnhis.firebasestorage.app",
    messagingSenderId: "497803256330",
    appId: "1:497803256330:web:4da28a9dbc17ef4e1db5f3"
  };

  const LOTS = [
    { id: 'surface', name: '노면 주차장' },
    { id: 'tower',   name: '주차타워' }
  ];

  const STATUSES = [
    { key: '여유', cls: 'btn-ok' },
    { key: '보통', cls: 'btn-mid' },
    { key: '혼잡', cls: 'btn-busy' },
    { key: '만차', cls: 'btn-full' }
  ];
  const CLS_BY_STATUS = Object.fromEntries(STATUSES.map(s => [s.key, s.cls]));

  const lotsEl = document.getElementById('lots');
  const connBar = document.getElementById('connBar');
  const state = {}; // id -> { status, updatedAt }

  function timeAgo(ts){
    if(!ts) return '아직 기록 없음';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if(diff < 60) return '방금 전';
    if(diff < 3600) return Math.floor(diff/60) + '분 전';
    if(diff < 86400) return Math.floor(diff/3600) + '시간 전';
    return Math.floor(diff/86400) + '일 전';
  }

  function render(){
    lotsEl.innerHTML = LOTS.map(lot => {
      const s = state[lot.id] || {};
      const status = s.status || '미설정';
      const badgeCls = CLS_BY_STATUS[s.status] || '';
      return `
        <div class="lot-card">
          <div class="lot-head">
            <span class="lot-name">${lot.name}</span>
            <span class="lot-status-badge ${status}">${status}</span>
          </div>
          <div class="lot-updated" data-updated="${lot.id}">${timeAgo(s.updatedAt)}</div>
          <div class="btn-grid">
            ${STATUSES.map(st => `
              <button class="status-btn ${st.cls} ${s.status === st.key ? 'active' : 'dim'}"
                      data-lot="${lot.id}" data-status="${st.key}">${st.key}</button>
            `).join('')}
          </div>
        </div>
      `;
    }).join('');

    lotsEl.querySelectorAll('.status-btn').forEach(btn => {
      btn.addEventListener('click', () => setStatus(btn.dataset.lot, btn.dataset.status));
    });
  }

  function refreshTimes(){
    LOTS.forEach(lot => {
      const el = lotsEl.querySelector(`[data-updated="${lot.id}"]`);
      if(el) el.textContent = timeAgo((state[lot.id]||{}).updatedAt);
    });
  }
  setInterval(refreshTimes, 15000);

  let dbRef = null;

  function setStatus(lotId, status){
    if(!dbRef){ alert('아직 서버에 연결되지 않았어요. 잠시 후 다시 시도해주세요.'); return; }
    dbRef.child('parking/' + lotId).update({
      status: status,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });
  }

  function init(){
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    dbRef = db.ref();

    db.ref('.info/connected').on('value', snap => {
      if(snap.val()){
        connBar.textContent = '🟢 실시간 연결됨';
        connBar.className = 'on';
      } else {
        connBar.textContent = '🔴 연결 끊김 · 재접속 중…';
        connBar.className = 'off';
      }
    });

    LOTS.forEach(lot => {
      db.ref('parking/' + lot.id).on('value', snap => {
        state[lot.id] = snap.val() || {};
        render();
      });
    });
  }

  render();
  init();
})();
</script>
</body>
</html>
