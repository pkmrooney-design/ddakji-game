<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Engine Unit Tests</title>
<style>
  body { background:#1a1a2e; color:#eee; font-family:monospace; padding:24px; }
  h1 { color:#f5c842; margin-bottom:16px; }
  .suite { margin-bottom:24px; }
  .suite-title { font-size:1rem; color:#aaa; margin-bottom:8px; border-bottom:1px solid #333; padding-bottom:4px; }
  .test { padding:6px 10px; margin:3px 0; border-radius:4px; font-size:.9rem; }
  .pass { background:rgba(46,204,113,.15); color:#2ecc71; }
  .fail { background:rgba(231,76,60,.2);  color:#e74c3c; }
  #summary { margin-top:24px; font-size:1.1rem; font-weight:bold; }
</style>
</head>
<body>
<h1>&#129514; &#44508;&#52825; &#50램&#51652; &#45800;&#50948; &#53580;&#49828;&#53944;</h1>
<div id="output"></div>
<div id="summary"></div>
<script src="engine.js"></script>
<script>
// ─── 미니 테스트 러너 ─────────────────────────────────
const results = [];

function suite(name, fn) {
  const div = document.createElement('div');
  div.className = 'suite';
  div.innerHTML = `<div class="suite-title">${name}</div>`;
  document.getElementById('output').appendChild(div);
  fn((desc, got, expected) => {
    const pass = JSON.stringify(got) === JSON.stringify(expected);
    results.push(pass);
    const el = document.createElement('div');
    el.className = `test ${pass ? 'pass' : 'fail'}`;
    el.textContent = pass
      ? `✓ ${desc}`
      : `✗ ${desc} → 기댓값: ${JSON.stringify(expected)}, 실제값: ${JSON.stringify(got)}`;
    div.appendChild(el);
  });
}

// ─── 상성 배율 테스트 ────────────────────────────────
suite('getTypeMult — 상성 배율 (불>풀>물>불)', assert => {
  assert('불 > 풀 (유리) → 1.2',   getTypeMult(TYPES.ALPHA, TYPES.GAMMA), 1.2);
  assert('물 > 불 (유리) → 1.2',   getTypeMult(TYPES.BETA,  TYPES.ALPHA), 1.2);
  assert('풀 > 물 (유리) → 1.2',   getTypeMult(TYPES.GAMMA, TYPES.BETA),  1.2);
  assert('풀 vs 불 (불리) → 0.8',  getTypeMult(TYPES.GAMMA, TYPES.ALPHA), 0.8);
  assert('불 vs 물 (불리) → 0.8',  getTypeMult(TYPES.ALPHA, TYPES.BETA),  0.8);
  assert('물 vs 풀 (불리) → 0.8',  getTypeMult(TYPES.BETA,  TYPES.GAMMA), 0.8);
  assert('거울 매치 불 vs 불 → 1', getTypeMult(TYPES.ALPHA, TYPES.ALPHA), 1.0);
  assert('무상성 공격자 → 1',       getTypeMult(TYPES.NONE,  TYPES.ALPHA), 1.0);
  assert('무상성 수비자 → 1',       getTypeMult(TYPES.ALPHA, TYPES.NONE),  1.0);
  assert('무상성 vs 무상성 → 1',    getTypeMult(TYPES.NONE,  TYPES.NONE),  1.0);
});

// ─── 확률 공식 검산 ──────────────────────────────────
// 공식: overlapRatio × 0.625 × typeMult × 100 + (atk - def)
suite('calcFlipChance — 공식 검산', assert => {
  const cannon = { type: TYPES.ALPHA, atk: 8, def: 2 };
  const tank   = { type: TYPES.ALPHA, atk: 2, def: 8 };
  const bal    = { type: TYPES.ALPHA, atk: 5, def: 5 };

  // 겹침 0% → 항상 0
  assert('겹침 0% → 0%', calcFlipChance(cannon, tank, 0), 0);

  // 겹침 80%, 중립, 밸런스 vs 밸런스 → 기준점 50%
  // 0.8 × 0.625 × 1.0 × 100 + 0 = 50
  assert('겹침 80%, 중립, 밸런스 vs 밸런스 → 50%', calcFlipChance(bal, bal, 0.8), 50);

  // 겹침 80%, 유리상성(불>풀), 밸런스 vs 밸런스
  // 0.8 × 0.625 × 1.2 × 100 + 0 = 60
  const balGamma = { type: TYPES.GAMMA, atk: 5, def: 5 };
  assert('겹침 80%, 유리상성(불>풀), 밸런스 vs 밸런스 → 60%', calcFlipChance(bal, balGamma, 0.8), 60);

  // 겹침 80%, 불리상성(불<물), 밸런스 vs 밸런스
  // 0.8 × 0.625 × 0.8 × 100 + 0 = 40
  const balBeta = { type: TYPES.BETA, atk: 5, def: 5 };
  assert('겹침 80%, 불리상성(불<물), 밸런스 vs 밸런스 → 40%', calcFlipChance(bal, balBeta, 0.8), 40);

  // 겹침 60%, 중립, 밸런스 vs 밸런스
  // 0.6 × 0.625 × 1.0 × 100 + 0 = 38 (반올림)
  assert('겹침 60%, 중립, 밸런스 vs 밸런스 → 38%', calcFlipChance(bal, bal, 0.6), 38);

  // 겹침 100%, 중립, 대포 vs 대포
  // 1.0 × 0.625 × 1.0 × 100 + (8-2) = 69
  assert('겹침 100%, 중립, 대포 vs 대포 → 69%', calcFlipChance(cannon, cannon, 1.0), 69);

  // 겹침 50%, 중립, 대포 vs 대포
  // 0.5 × 0.625 × 1.0 × 100 + (8-2) = 37
  assert('겹침 50%, 중립, 대포 vs 대포 → 37%', calcFlipChance(cannon, cannon, 0.5), 37);
});

// ─── clamp 테스트 ────────────────────────────────────
suite('calcFlipChance — clamp (0~100)', assert => {
  // 겹침 100%, 유리, atk:20 vs def:0 → 1.0×0.6×1.3×100 + 20 = 98 (초과 케이스는 atk 더 키움)
  const bigAtk  = { type: TYPES.ALPHA, atk: 30, def: 0 };
  const weakDef = { type: TYPES.GAMMA, atk: 0,  def: 0 }; // 불>풀 유리상성
  // 1.0×0.6×1.3×100 + (30-0) = 78+30 = 108 → 100
  assert('100 초과 → 100 clamp', calcFlipChance(bigAtk, weakDef, 1.0), 100);

  // 겹침 0% → 0 (이미 위에서 검증, clamp 관점 재확인)
  assert('겹침 0% → 0 clamp', calcFlipChance(cannon_dummy(), tank_dummy(), 0), 0);

  // 불리상성, 낮은 atk, 높은 def: 음수가 될 수 있는 케이스 → 0 clamp
  // BETA(불리 vs ALPHA) atk:0 vs ALPHA def:20
  // 1.0×0.6×0.8×100 + (0-20) = 48-20 = 28 → 양수이므로 더 극단: atk:0, def:100
  const zeroAtk = { type: TYPES.BETA,  atk: 0, def: 0  };
  const bigDef  = { type: TYPES.ALPHA, atk: 0, def: 100 };
  // 1.0×0.6×0.8×100 + (0-100) = 48-100 = -52 → 0
  assert('0 미만 → 0 clamp', calcFlipChance(zeroAtk, bigDef, 1.0), 0);
});

function cannon_dummy() { return { type: TYPES.ALPHA, atk: 8, def: 2 }; }
function tank_dummy()   { return { type: TYPES.ALPHA, atk: 2, def: 8 }; }

// ─── 무상성 스탯 합계 검증 ────────────────────────────
suite('카드 로스터 — 스탯 합계 검증', assert => {
  CARD_ROSTER.forEach(card => {
    const expected = card.type === TYPES.NONE
      ? CONFIG.STAT_TOTAL_NONE
      : CONFIG.STAT_TOTAL_NORMAL;
    assert(
      `${card.label} (atk:${card.atk} def:${card.def}) 합계 = ${expected}`,
      card.atk + card.def,
      expected
    );
  });
});

// ─── 덱 유효성 검사 ───────────────────────────────────
suite('validateDeck', assert => {
  const [c1, c2, c3, c4] = CARD_ROSTER;

  assert('정상 덱 3장',
    validateDeck([c1, c2, c3]).valid, true);

  assert('2장 → 무효',
    validateDeck([c1, c2]).valid, false);

  assert('4장 → 무효',
    validateDeck([c1, c2, c3, c4]).valid, false);

  assert('동일 카드 중복 → 무효',
    validateDeck([c1, c1, c2]).valid, false);

  assert('같은 타입 다른 스탯 → 유효 (alpha_cannon + alpha_tank)',
    validateDeck([CARD_ROSTER[0], CARD_ROSTER[2], CARD_ROSTER[3]]).valid, true);
});

// ─── RNG 시드 재현성 ─────────────────────────────────
suite('createRNG — 시드 재현성', assert => {
  const a = createRNG(42);
  const b = createRNG(42);
  const seqA = [a.next(), a.next(), a.next()];
  const seqB = [b.next(), b.next(), b.next()];
  assert('같은 시드 → 동일 시퀀스', seqA, seqB);

  const c = createRNG(99);
  const seqC = [c.next(), c.next(), c.next()];
  assert('다른 시드 → 다른 시퀀스', seqA[0] !== seqC[0], true);
});

// ─── 요약 ─────────────────────────────────────────────
const passed = results.filter(Boolean).length;
const total  = results.length;
const summary = document.getElementById('summary');
summary.style.color = passed === total ? '#2ecc71' : '#e74c3c';
summary.textContent = `결과: ${passed} / ${total} 통과 ${passed === total ? '✓ ALL PASS' : '✗ FAIL'}`;
</script>
</body>
</html>
