<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Engine Unit Tests</title>
<style>
  body { background:#1a1a2e; color:#eee; font-family:monospace; padding:24px; }
  h1 { color:#f5c842; margin-bottom:16px; }
  .suite { margin-bottom:24px; }
  .suite-title { font-size:1rem; color:#aaa; margin-bottom:8px; border-bottom:1px solid #333; padding-bottom:4px; }
  .test { padding:6px 10px; margin:3px 0; border-radius:4px; font-size:.9rem; }
  .pass { background:rgba(46,204,113,.15); color:#2ecc71; }
  .fail { background:rgba(231,76,60,.2);  color:#e74c3c; }
  #summary { margin-top:24px; font-size:1.1rem; font-weight:bold; }
</style>
</head>
<body>
<h1>🧪 규칙 엔진 단위 테스트</h1>
<div id="output"></div>
<div id="summary"></div>
<script src="engine.js"></script>
<script>
// ─── 미니 테스트 러너 ─────────────────────────────────
const results = [];

function suite(name, fn) {
  const div = document.createElement('div');
  div.className = 'suite';
  div.innerHTML = `<div class="suite-title">${name}</div>`;
  document.getElementById('output').appendChild(div);
  fn((desc, got, expected) => {
    const pass = JSON.stringify(got) === JSON.stringify(expected);
    results.push(pass);
    const el = document.createElement('div');
    el.className = `test ${pass ? 'pass' : 'fail'}`;
    el.textContent = pass
      ? `✓ ${desc}`
      : `✗ ${desc} → 기댓값: ${JSON.stringify(expected)}, 실제값: ${JSON.stringify(got)}`;
    div.appendChild(el);
  });
}

// ─── 상성 보정 테스트 ─────────────────────────────────
suite('getTypeAdj — 상성 보정값', assert => {
  assert('ALPHA > BETA (유리)',    getTypeAdj(TYPES.ALPHA, TYPES.BETA),   20);
  assert('BETA  > GAMMA (유리)',   getTypeAdj(TYPES.BETA,  TYPES.GAMMA),  20);
  assert('GAMMA > ALPHA (유리)',   getTypeAdj(TYPES.GAMMA, TYPES.ALPHA),  20);
  assert('BETA  > ALPHA (불리)',   getTypeAdj(TYPES.BETA,  TYPES.ALPHA), -20);
  assert('ALPHA > GAMMA (불리)',   getTypeAdj(TYPES.ALPHA, TYPES.GAMMA), -20);
  assert('거울 매치 ALPHA vs ALPHA', getTypeAdj(TYPES.ALPHA, TYPES.ALPHA), 0);
  assert('무상성 공격자',           getTypeAdj(TYPES.NONE,  TYPES.ALPHA),  0);
  assert('무상성 수비자',           getTypeAdj(TYPES.ALPHA, TYPES.NONE),   0);
  assert('무상성 vs 무상성',        getTypeAdj(TYPES.NONE,  TYPES.NONE),   0);
});

// ─── 확률 공식 검산 (스펙 명시값) ────────────────────
suite('calcFlipChance — 스펙 검산', assert => {
  const cannon = { type: TYPES.ALPHA, atk: 8, def: 2 };
  const tank   = { type: TYPES.ALPHA, atk: 2, def: 8 };
  const bal    = { type: TYPES.ALPHA, atk: 5, def: 5 };

  // 중립 상성 케이스 (같은 타입 = 거울)
  assert('대포(공8) vs 탱커(무8), 중립 → 40%',  calcFlipChance(cannon, tank),   40);
  assert('대포 vs 대포, 중립 → 52%',             calcFlipChance(cannon, cannon), 52);
  assert('탱커 vs 탱커, 중립 → 28%',             calcFlipChance(tank,   tank),   28);

  // 최선: 대포(공8) + 유리상성, 상대 무2
  // ALPHA 대포 vs BETA 탱커(공2/무2) → atk=8, def=2 이므로
  // 40 + 20(유리) + (8×2) − (2×2) = 40+20+16−4 = 72
  const oppWeak = { type: TYPES.BETA, atk: 2, def: 2 };
  assert('최선: 대포+유리 vs 무2 → 72%', calcFlipChance(cannon, oppWeak), 72);

  // 최악: 탱커(공2) + 불리상성 vs 탱커(무8)
  // BETA 탱커 vs ALPHA 탱커 → BETA는 ALPHA에게 불리(-20)
  // 40 − 20(불리) + (2×2) − (8×2) = 40−20+4−16 = 8
  const atkWeak = { type: TYPES.BETA,  atk: 2, def: 8 };  // BETA는 ALPHA에게 불리
  const defStr  = { type: TYPES.ALPHA, atk: 2, def: 8 };
  assert('최악: 탱커+불리 vs 무8 → 8%', calcFlipChance(atkWeak, defStr), 8);
});

// ─── clamp 테스트 ────────────────────────────────────
suite('calcFlipChance — clamp (0~100)', assert => {
  // atk:30 → 40+20+(30×2)−0 = 120 → clamp 100
  const superAtk = { type: TYPES.ALPHA, atk: 30, def: 0 };
  assert('100 초과 → 100으로 clamp', calcFlipChance(superAtk, { type: TYPES.BETA, atk: 0, def: 0 }), 100);

  // BETA(불리) atk:0 vs ALPHA def:30 → 40−20+0−60 = −40 → clamp 0
  const superDef = { type: TYPES.ALPHA, atk: 0, def: 30 };
  assert('0 미만 → 0으로 clamp', calcFlipChance({ type: TYPES.BETA, atk: 0, def: 0 }, superDef), 0);
});

// ─── 무상성 스탯 합계 검증 ────────────────────────────
suite('카드 로스터 — 스탯 합계 검증', assert => {
  CARD_ROSTER.forEach(card => {
    const expected = card.type === TYPES.NONE
      ? CONFIG.STAT_TOTAL_NONE
      : CONFIG.STAT_TOTAL_NORMAL;
    assert(
      `${card.label} (atk:${card.atk} def:${card.def}) 합계 = ${expected}`,
      card.atk + card.def,
      expected
    );
  });
});

// ─── 덱 유효성 검사 ───────────────────────────────────
suite('validateDeck', assert => {
  const [c1, c2, c3, c4] = CARD_ROSTER;

  assert('정상 덱 3장',
    validateDeck([c1, c2, c3]).valid, true);

  assert('2장 → 무효',
    validateDeck([c1, c2]).valid, false);

  assert('4장 → 무효',
    validateDeck([c1, c2, c3, c4]).valid, false);

  assert('동일 카드 중복 → 무효',
    validateDeck([c1, c1, c2]).valid, false);

  assert('같은 타입 다른 스탯 → 유효 (alpha_cannon + alpha_tank)',
    validateDeck([CARD_ROSTER[0], CARD_ROSTER[2], CARD_ROSTER[3]]).valid, true);
});

// ─── RNG 시드 재현성 ─────────────────────────────────
suite('createRNG — 시드 재현성', assert => {
  const a = createRNG(42);
  const b = createRNG(42);
  const seqA = [a.next(), a.next(), a.next()];
  const seqB = [b.next(), b.next(), b.next()];
  assert('같은 시드 → 동일 시퀀스', seqA, seqB);

  const c = createRNG(99);
  const seqC = [c.next(), c.next(), c.next()];
  assert('다른 시드 → 다른 시퀀스', seqA[0] !== seqC[0], true);
});

// ─── 요약 ─────────────────────────────────────────────
const passed = results.filter(Boolean).length;
const total  = results.length;
const summary = document.getElementById('summary');
summary.style.color = passed === total ? '#2ecc71' : '#e74c3c';
summary.textContent = `결과: ${passed} / ${total} 통과 ${passed === total ? '✓ ALL PASS' : '✗ FAIL'}`;
</script>
</body>
</html>
