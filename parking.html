<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>주차장 현황</title>
<style>
  :root{
    --navy: #9c1c2e;
    --navy-dark: #7a1522;
    --blue-tint: #fbebec;
    --line: #ecd9da;
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #222c36;
    --text-dim: #64707c;
    --ok: #1e8e5a;
    --mid: #b8860b;
    --busy: #c9660a;
    --full: #c0392b;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', -apple-system, sans-serif;
  }

  .gov-header{
    background: var(--navy);
    color: #fff;
    padding: 20px 16px 17px;
    text-align: center;
    border-bottom: 3px solid var(--navy-dark);
  }
  .brand{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .brand-icon{ flex: none; width: 40px; height: 40px; }
  .gov-header h1{
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-align: left;
  }
  .gov-header .sub{
    margin-top: 4px;
    font-size: 12.5px;
    color: #f2cdd2;
    text-align: left;
  }

  #connBar{
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--blue-tint);
    border-bottom: 1px solid var(--line);
    padding: 8px;
  }
  #connBar.on{ color: var(--ok); }
  #connBar.off{ color: var(--full); }

  main{ padding: 20px 16px 40px; }
  .lots{
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .lot-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 6px solid var(--text-dim);
    border-radius: 6px;
    padding: 20px 20px 18px;
    box-shadow: 0 1px 2px rgba(156,28,46,0.08);
  }
  .lot-name{
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .lot-status{
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .lot-status.여유{ color: var(--ok); }
  .lot-status.보통{ color: var(--mid); }
  .lot-status.혼잡{ color: var(--busy); }
  .lot-status.만차{ color: var(--full); }
  .lot-status.미설정{ color: var(--text-dim); font-size: 20px; }

  .lot-card.여유{ border-left-color: var(--ok); }
  .lot-card.보통{ border-left-color: var(--mid); }
  .lot-card.혼잡{ border-left-color: var(--busy); }
  .lot-card.만차{ border-left-color: var(--full); }

  .lot-updated{
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
  }

</style>
</head>
<body>

<div class="gov-header">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="60" cy="54" r="54" fill="#e3495a"/>
      <path d="M28 96 L46 90 L50 108 L30 112 Z" fill="#7a1522"/>
      <text x="60" y="72" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="58" fill="#ffffff" text-anchor="middle">P</text>
    </svg>
    <div>
      <h1>실시간 주차장 현황</h1>
      <div class="sub">새로고침 없이 자동으로 갱신돼요</div>
    </div>
  </div>
</div>
<div id="connBar">연결 확인 중…</div>

<main>
  <div class="lots" id="lots"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAydvkSqvoAVJ--1R4_aZv7ubZgjJUuKNI",
    authDomain: "parkinglotnhis.firebaseapp.com",
    databaseURL: "https://parkinglotnhis-default-rtdb.firebaseio.com",
    projectId: "parkinglotnhis",
    storageBucket: "parkinglotnhis.firebasestorage.app",
    messagingSenderId: "497803256330",
    appId: "1:497803256330:web:4da28a9dbc17ef4e1db5f3"
  };

  const LOTS = [
    { id: 'surface', name: '노면 주차장' },
    { id: 'tower',   name: '주차타워' }
  ];

  const lotsEl = document.getElementById('lots');
  const connBar = document.getElementById('connBar');
  const state = {}; // id -> { status, updatedAt }

  function formatUpdated(ts){
    if(!ts) return '아직 기록 없음';
    const d = new Date(ts);
    const now = new Date();
    const timeStr = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: true });
    if(d.toDateString() === now.toDateString()) return timeStr + ' 업데이트';
    return (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + timeStr + ' 업데이트';
  }

  function render(){
    lotsEl.innerHTML = LOTS.map(lot => {
      const s = state[lot.id] || {};
      const status = s.status || '미설정';
      return `
        <div class="lot-card ${status}">
          <div class="lot-name">${lot.name}</div>
          <div class="lot-status ${status}">${status}</div>
          <div class="lot-updated">${formatUpdated(s.updatedAt)}</div>
        </div>
      `;
    }).join('');
  }

  function init(){
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();

    db.ref('.info/connected').on('value', snap => {
      if(snap.val()){
        connBar.textContent = '🟢 실시간 연결됨';
        connBar.className = 'on';
      } else {
        connBar.textContent = '🔴 연결 끊김 · 재접속 중…';
        connBar.className = 'off';
      }
    });

    LOTS.forEach(lot => {
      db.ref('parking/' + lot.id).on('value', snap => {
        state[lot.id] = snap.val() || {};
        render();
      });
    });
  }

  render();
  init();
})();
</script>
</body>
</html>
